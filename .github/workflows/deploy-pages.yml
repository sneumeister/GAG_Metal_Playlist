# Stellt Playlist- und Reject-HTML über GitHub Pages bereit.
# Playlist: https://sneumeister.github.io/GAG_Metal_Playlist/
# Rejects:  https://sneumeister.github.io/GAG_Metal_Playlist/GAG_Metal_rejected.html
#
# Voraussetzung: Repo public + Settings → Pages → Source: GitHub Actions.
# Solange das Repo privat ist, wird der Job übersprungen (kein Fail).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - GAG_Metal_playlist.html
      - GAG_Metal_rejected.html
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Privat: kein Pages auf Free-Plan → Job skippen statt rot scheitern.
    if: ${{ !github.event.repository.private }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Site vorbereiten
        run: |
          mkdir -p _site
          cp GAG_Metal_playlist.html _site/index.html
          cp GAG_Metal_playlist.html _site/GAG_Metal_playlist.html
          cp GAG_Metal_rejected.html _site/GAG_Metal_rejected.html

      - name: Pages konfigurieren
        uses: actions/configure-pages@v6

      - name: Artifact hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
